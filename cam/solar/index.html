<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02050b" />
    <meta name="description" content="두 손으로 픽셀 지구를 움직이고 회전시키는 카메라 인터랙션" />
    <title>Solar System · Cam</title>
  </head>
  <body>
    <main class="solar-app">
      <video id="camera" muted playsinline aria-hidden="true"></video>
      <div class="camera-shade" aria-hidden="true"></div>
      <div id="earthLayer" aria-hidden="true">
        <div class="earth-object hidden" id="earthObject">
          <img src="/cam/solar/earth.gif" alt="" />
        </div>
      </div>

      <header class="camera-header">
        <a class="back-link" href="/cam/" aria-label="cam 목록으로 돌아가기">← cam</a>
        <div class="tracking-status" id="trackingStatus" role="status" aria-live="polite">
          <i></i><span>카메라 준비 중</span>
        </div>
      </header>

      <aside class="gesture-guide" aria-label="사용 방법">
        <p><span aria-hidden="true">☝️</span><b>검지를 세워보세요</b><small>손끝에 지구가 나타나요</small></p>
        <p><span aria-hidden="true">↔️</span><b>반대손을 스와이프해요</b><small>좌우 속도와 방향대로 회전해요</small></p>
      </aside>

      <section class="permission-panel" id="permissionPanel" aria-live="polite">
        <span class="permission-icon" aria-hidden="true">🌎</span>
        <p>SOLAR SYSTEM</p>
        <h1>손끝에 지구를 올려보세요</h1>
        <div class="permission-copy" id="permissionCopy">양손의 움직임을 인식할 수 있도록 카메라 권한을 허용해 주세요.</div>
        <button id="startCamera" type="button">카메라 시작하기</button>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
