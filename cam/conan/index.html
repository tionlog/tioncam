<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="화면 가득 펼쳐지는 실시간 카메라" />
    <title>conan · Cam</title>
  </head>
  <body>
    <main class="camera-app">
      <video id="camera" autoplay muted playsinline aria-label="실시간 카메라 영상"></video>
      <canvas id="conanEffect" aria-hidden="true"></canvas>
      <canvas id="conanCostume" aria-hidden="true"></canvas>
      <header class="camera-header">
        <a class="control" href="%BASE_URL%cam/" aria-label="cam 목록으로 돌아가기">← cam</a>
        <span class="wordmark">conan</span>
        <span id="status" class="status" role="status">준비 중</span>
      </header>

      <section id="permissionPanel" class="permission-panel" aria-labelledby="panelTitle">
        <p class="eyebrow">CONAN / CAMERA</p>
        <h1 id="panelTitle">화면 가득, 지금의 모습.</h1>
        <p id="permissionCopy" aria-live="polite">카메라 접근을 허용하면 영상이 전체 화면에 표시됩니다.</p>
        <button id="startCamera" class="start-button" type="button">카메라 시작</button>
      </section>

      <nav class="camera-controls" aria-label="카메라 조작">
        <div id="gestureGuide" class="gesture-guide" hidden>
          <span id="gestureStatus" role="status">손 인식 준비 중…</span>
          <span id="trackingHint" class="tracking-hint" aria-live="polite" hidden>인식 상태 확인 중…</span>
          <button id="retryTracking" class="control" type="button" hidden>손 인식 다시 시도</button>
        </div>
        <div class="camera-buttons">
        <button id="switchCamera" class="control" type="button" disabled>카메라 전환</button>
        <button id="fullscreen" class="control" type="button" hidden>전체 화면</button>
        </div>
      </nav>
      <noscript><p class="noscript">카메라를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
